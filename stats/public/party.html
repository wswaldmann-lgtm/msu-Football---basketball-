<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18453B">
<title>MSU Watch Party</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#18453B;--green-dark:#0F2B24;--green-light:#1E5A4C;--gold:#C5A551;--bg:#F2F0EB;--card:#FAFAF8;--text:#1A1A1A;--muted:#6E6C66;--border:#E3E0D9;--in:#27AE60;--maybe:#C5A551;--out:#C0392B;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1C2422;--text:#EDEBE6;--muted:#9C9992;--border:#2C3532;--field:#121917}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Source Sans 3',system-ui,sans-serif;max-width:560px;margin:0 auto;padding-bottom:2.5rem}
header{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:1.5rem 16px 1.3rem;border-bottom:3px solid var(--gold)}
.kicker{font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}
h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:1.65rem;line-height:1.15;margin-top:.25rem}
.when{opacity:.85;margin-top:.3rem}
main{padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.05rem}
.card h2{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.85rem;color:var(--green);margin-bottom:.6rem}
@media (prefers-color-scheme:dark){.card h2{color:#5BBF97}}
.place{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.25rem}
.addr{color:var(--muted);margin-top:.15rem}
.meta{display:grid;gap:.35rem;margin-top:.7rem;font-size:.95rem}
.note{margin-top:.7rem;padding:.6rem .75rem;border-radius:10px;background:rgba(197,165,81,.14);font-size:.93rem;white-space:pre-wrap}
a.map{display:inline-block;margin-top:.55rem;color:var(--green);font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){a.map{color:#5BBF97}}
.totals{display:flex;gap:.6rem;flex-wrap:wrap}
.pill{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;background:rgba(128,128,128,.1)}
.pill b{font-size:1.05rem;margin-right:.2rem}
input{font:inherit;width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--field);color:var(--text)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.7rem}
.ans{font-family:'Oswald',sans-serif;font-weight:600;font-size:.88rem;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--border);background:transparent;color:var(--text);border-radius:12px;padding:.75rem .3rem;cursor:pointer}
.ans .ic{display:block;font-size:1.3rem;margin-bottom:.15rem}
.ans.on[data-s="in"]{border-color:var(--in);background:rgba(39,174,96,.12)}
.ans.on[data-s="maybe"]{border-color:var(--maybe);background:rgba(197,165,81,.15)}
.ans.on[data-s="out"]{border-color:var(--out);background:rgba(192,57,43,.1)}
.count{display:none;align-items:center;justify-content:space-between;margin-top:.7rem;padding:.5rem .7rem;border-radius:10px;background:rgba(39,174,96,.08)}
.count.show{display:flex}
.step{display:flex;align-items:center;gap:.7rem;font-family:'Oswald',sans-serif;font-weight:700;font-size:1.15rem}
.step button{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer}
.btn{display:block;width:100%;margin-top:.8rem;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.95rem;border:none;border-radius:12px;padding:.85rem;cursor:pointer;background:var(--green);color:#fff}
.btn.gold{background:var(--gold);color:#1A1A1A}
.btn:disabled{opacity:.55}
.msg{text-align:center;font-size:.9rem;margin-top:.55rem;color:var(--muted);min-height:1.2em}
.group{margin-top:.4rem}
.group h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.7rem 0 .3rem}
.who{display:flex;align-items:center;gap:.5rem;padding:.42rem 0;border-bottom:1px solid var(--border);font-size:.97rem}
.who:last-child{border-bottom:none}
.who .nm{font-weight:700}
.who .via{color:var(--muted);font-size:.83rem}
.who .x{margin-left:auto;border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:0 .3rem}
.empty{color:var(--muted);font-size:.92rem}
.hostbar{background:rgba(197,165,81,.16);border:1px solid rgba(197,165,81,.5);border-radius:12px;padding:.7rem .9rem;font-size:.9rem}
.center{text-align:center;padding:3rem 1rem;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;text-align:center}
.howto div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.55rem .3rem;font-size:.8rem;line-height:1.25;color:var(--muted)}
.howto b{display:block;font-family:'Oswald',sans-serif;font-size:1.05rem;color:var(--text);margin-bottom:.1rem}
.howto-t{font-family:'Oswald',sans-serif;font-weight:600;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:.4rem}
.bring{margin-top:.6rem}
.bring label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.nextrow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.nextrow a,.nextrow button{display:block;text-align:center;text-decoration:none;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.8rem;border:1px solid var(--border);border-radius:10px;padding:.7rem .4rem;background:transparent;color:var(--text);cursor:pointer}
.nextrow .wide{grid-column:1/-1;background:var(--gold);border-color:var(--gold);color:#1A1A1A;font-size:.92rem}
.who .br{color:var(--muted);font-size:.85rem}
.nomap{display:block;margin-top:.55rem;color:var(--muted);font-size:.9rem}
.getapp{display:flex;gap:.8rem;align-items:center;background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:14px;padding:.95rem 1rem;text-decoration:none}
.getapp .ic{flex:none;width:3rem;height:3rem;border-radius:12px;background:#fff center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.getapp b{font-family:'Oswald',sans-serif;font-size:1.05rem;letter-spacing:.02em;display:block}
.getapp span{font-size:.86rem;opacity:.85;line-height:1.35}
.getapp .go{margin-left:auto;flex:none;background:var(--gold);color:#1A1A1A;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.78rem;border-radius:99px;padding:.5rem .8rem}
.foot a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="kicker" id="kicker">📺 MSU Watch Party</div>
  <h1 id="game">Loading…</h1>
  <div class="when" id="when"></div>
</header>
<main id="main">
  <div class="center" id="loading">Loading the party…</div>
</main>
<script>
const API = '/api';
const id = (location.pathname.split('/p/')[1] || '').split(/[/?#]/)[0].toLowerCase();
const params = new URLSearchParams(location.search);
const via = (params.get('via') || '').slice(0, 40);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// The host's private link carries ?host=KEY. Remember it on this phone, then strip it from the
// address bar so it never gets forwarded by accident.
if (params.get('host')) {
  const keys = LS.get('wp_hostkeys', {}); keys[id] = params.get('host'); LS.set('wp_hostkeys', keys);
  params.delete('host'); history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
}
const hostKey = (LS.get('wp_hostkeys', {}))[id] || '';
function rid() {
  const all = LS.get('wp_rids', {});
  if (!all[id]) { all[id] = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^a-z0-9]/gi, '').slice(0, 20).toLowerCase(); LS.set('wp_rids', all); }
  return all[id];
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let data = null, choice = null, count = 1;
const NAMES = { watch: 'MSU Watch Party', tailgate: 'MSU Tailgate' };
const isTail = () => data && data.party.kind === 'tailgate';
const partyName = () => NAMES[isTail() ? 'tailgate' : 'watch'];

function fmtGameDate(s, tba, sport) {
  const d = new Date(s); if (isNaN(d)) return '';
  const start = sport === 'football' ? 'kickoff' : 'tip-off';
  if (tba) return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + start + ' time TBA';
  return d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ' + start;
}

// Calendar: start at the meet time if we can read it ("6:30 PM"), else around the game
function meetDate(p) {
  const g = new Date(p.gameDate); if (isNaN(g)) return null;
  const m = String(p.time || '').match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?/i); if (!m) return null;
  let h = +m[1] % 12; const ap = (m[3] || '').toLowerCase();
  if (ap === 'p' || (!ap && h < 11)) h += 12;
  const d = new Date(g); d.setHours(h, +(m[2] || 0), 0, 0); return d;
}
function calTimes(p) {
  const g = new Date(p.gameDate), meet = meetDate(p);
  if (meet) return { start: meet, end: new Date(Math.max(meet.getTime() + 3 * 3600e3, p.tba ? 0 : g.getTime() + 3.5 * 3600e3)) };
  if (p.tba) return { allDay: g };
  return { start: new Date(g.getTime() - 3600e3), end: new Date(g.getTime() + 3.5 * 3600e3) };
}
const zt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const ymd = d => '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
function calInfo() {
  const p = data.party, c = calTimes(p);
  const title = partyName() + ': ' + (p.game || 'game');
  const loc = [p.place, p.address].filter(Boolean).join(', ');
  const det = (p.time ? 'Meet at ' + p.time + '\n' : '') + (p.note ? p.note + '\n' : '') + 'Invite: ' + location.origin + '/p/' + id;
  return { p, c, title, loc, det };
}
function googleCal() {
  const { c, title, loc, det } = calInfo();
  let dates; if (c.allDay) { const n = new Date(c.allDay); n.setDate(n.getDate() + 1); dates = ymd(c.allDay) + '/' + ymd(n); } else dates = zt(c.start) + '/' + zt(c.end);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + dates + '&location=' + encodeURIComponent(loc) + '&details=' + encodeURIComponent(det);
}
function appleCal() {
  const { c, title, loc, det } = calInfo(), e = s => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  let when; if (c.allDay) { const n = new Date(c.allDay); n.setDate(n.getDate() + 1); when = 'DTSTART;VALUE=DATE:' + ymd(c.allDay) + '\r\nDTEND;VALUE=DATE:' + ymd(n); } else when = 'DTSTART:' + zt(c.start) + '\r\nDTEND:' + zt(c.end);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Game Tracker//Party//EN', 'BEGIN:VEVENT', 'UID:' + id + '@party', 'DTSTAMP:' + zt(new Date()), when,
    'SUMMARY:' + e(title), 'LOCATION:' + e(loc), 'DESCRIPTION:' + e(det), 'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:' + e(title), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'party.ics'; document.body.appendChild(a); a.click(); a.remove();
}

async function load() {
  if (!/^[a-z0-9]{8,24}$/.test(id)) return notFound();
  try {
    const r = await fetch(API + '/party?id=' + id, { cache: 'no-store', headers: hostKey ? { 'x-host-key': hostKey } : {} });
    if (r.status === 404) return notFound();
    data = await r.json();
    render();
  } catch (e) { document.getElementById('main').innerHTML = '<div class="center">Couldn\'t load the party. Check your connection and refresh.</div>'; }
}
function notFound() {
  document.getElementById('game').textContent = 'Party not found';
  document.getElementById('main').innerHTML = '<div class="center">This invite link doesn\'t match a watch party. Ask whoever sent it for a fresh link.</div>';
}

function render() {
  const p = data.party, t = data.totals;
  document.title = partyName() + ' — ' + (p.game || p.place);
  document.getElementById('kicker').textContent = (isTail() ? '🍔 ' : '📺 ') + partyName();
  document.getElementById('game').textContent = p.game || 'Spartans game';
  document.getElementById('when').textContent = fmtGameDate(p.gameDate, p.tba, p.sport);
  const me = LS.get('wp_name', '');
  const myAns = (LS.get('wp_answers', {}))[id];
  if (choice === null && myAns) { choice = myAns.status; count = myAns.count || 1; }

  const list = s => data.rsvps.filter(r => r.status === s);
  const row = r => `<div class="who"><span class="nm">${esc(r.name)}</span>${r.status === 'in' && r.count > 1 ? `<span>+${r.count - 1}</span>` : ''}${r.bring ? `<span class="br">· 🧺 ${esc(r.bring)}</span>` : ''}${r.via ? `<span class="via">via ${esc(r.via)}</span>` : ''}${data.isHost && r.rid ? `<button class="x" title="Remove" onclick="removeAns('${esc(r.rid)}','${esc(r.name)}')">×</button>` : ''}</div>`;
  const group = (s, title) => list(s).length ? `<div class="group"><h3>${title} (${list(s).length})</h3>${list(s).map(row).join('')}</div>` : '';

  // A map pin wins; otherwise the address. With neither, don't let Maps guess a random city.
  const hasPin = typeof p.lat === 'number' && typeof p.lng === 'number';
  const mapUrl = hasPin ? 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng
    : (p.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.place, p.address].filter(Boolean).join(', ')) : '');
  const shownAddr = p.address && !/^Map pin/.test(p.address) ? p.address : '';
  document.getElementById('main').innerHTML = `
    ${data.isHost ? `<div class="hostbar">⭐ <b>You're hosting.</b> Everyone's answers show up below (remove one with ×). Tip: the day before, open the app and tap <b>Send again</b> as a reminder.</div>`
      : !myAns ? `<div><div class="howto-t">How to answer · 10 seconds</div><div class="howto"><div><b>1</b>Type your name</div><div><b>2</b>Tap 🙌, 🤔 or 😞</div><div><b>3</b>Hit Send</div></div></div>` : ''}
    <div class="card">
      <h2>Where</h2>
      <div class="place">${esc(p.place)}</div>
      ${shownAddr ? `<div class="addr">${esc(shownAddr)}</div>` : ''}
      ${mapUrl ? `<a class="map" href="${mapUrl}" target="_blank" rel="noopener">📍 Open in Maps</a>` : `<span class="nomap">No address yet. Ask ${esc(p.host || 'the host')} where exactly.</span>`}
      <div class="meta">
        ${p.time ? `<div>🕖 <b>Meet at:</b> ${esc(p.time)}</div>` : ''}
        ${p.host ? `<div>🙋 <b>Hosted by:</b> ${esc(p.host)}</div>` : ''}
      </div>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    </div>

    <div class="card">
      <h2>Are you in?</h2>
      <input id="name" placeholder="Your name" maxlength="40" value="${esc(me)}">
      <div class="answers">
        <button class="ans ${choice === 'in' ? 'on' : ''}" data-s="in" onclick="pick('in')"><span class="ic">🙌</span>I'm in</button>
        <button class="ans ${choice === 'maybe' ? 'on' : ''}" data-s="maybe" onclick="pick('maybe')"><span class="ic">🤔</span>Maybe</button>
        <button class="ans ${choice === 'out' ? 'on' : ''}" data-s="out" onclick="pick('out')"><span class="ic">😞</span>Can't make it</button>
      </div>
      <div class="count ${choice === 'in' ? 'show' : ''}" id="countRow">
        <span>How many in your group?</span>
        <div class="step"><button onclick="step(-1)">−</button><span id="countVal">${count}</span><button onclick="step(1)">+</button></div>
      </div>
      ${isTail() ? `<div class="bring" id="bringRow" style="${choice === 'out' ? 'display:none' : ''}"><label for="bring">🧺 What are you bringing? (optional)</label><input id="bring" maxlength="60" placeholder="Chips, a cooler, the cornhole set…" value="${esc(myAns?.bring || '')}"></div>` : ''}
      <button class="btn" id="sendBtn" onclick="send()">${myAns ? 'Update my answer' : 'Send my answer'}</button>
      <div class="msg" id="msg"></div>
    </div>

    ${myAns ? `<div class="card">
      <h2>What's next</h2>
      <p style="font-size:.93rem;color:var(--muted)">${myAns.status === 'out' ? "Thanks for answering. Changed your mind? Just pick a new answer above." : "Don't forget it: put it on your calendar. Know someone who'd come? Pass it on."}</p>
      <div class="nextrow">
        ${myAns.status !== 'out' ? `<a href="${googleCal()}" target="_blank" rel="noopener">📅 Google Calendar</a><button onclick="appleCal()">📅 iPhone / Outlook</button>` : ''}
        <button class="wide" onclick="forward()">📤 Invite a friend</button>
      </div>
    </div>` : ''}

    <div class="card">
      <h2>Who's coming</h2>
      <div class="totals">
        <span class="pill">🙌 <b>${t.people}</b> coming</span>
        <span class="pill">🤔 <b>${t.maybe}</b> maybe</span>
        <span class="pill">😞 <b>${t.out}</b> can't</span>
      </div>
      ${data.rsvps.length ? group('in', "I'm in") + group('maybe', 'Maybe') + group('out', "Can't make it") : '<p class="empty" style="margin-top:.7rem">No answers yet. Be the first!</p>'}
    </div>

    ${myAns ? '' : `<button class="btn gold" onclick="forward()">📤 Invite a friend</button>`}
    ${myAns || data.isHost ? `<a class="getapp" href="/?from=invite${data.isHost ? '' : '&add=1'}"><span class="ic" style="background-image:url(/icons/icon-192.png)"></span><span><b>${data.isHost ? 'Your app' : 'Get the app ' + esc(sender()) + ' used'}</b><span>${data.isHost ? 'Back to the schedule and your parties.' : 'Free. Schedule, TV, live scores and your own parties.'}</span></span><span class="go">${data.isHost ? 'Open' : 'Get it'}</span></a>` : ''}
    <div class="foot">Made with the free <a href="/?from=invite">Spartans Game Tracker</a> · Go Green! 💚</div>`;
}

// Whoever sent this person the link: the friend who forwarded it, else the host
function sender() {
  const me = (LS.get('wp_name', '') || '').toLowerCase(), fwd = (LS.get('wp_via', {}))[id] || via;
  if (fwd && fwd.toLowerCase() !== me) return fwd;
  return data.party.host && data.party.host.toLowerCase() !== me ? data.party.host : 'your friend';
}
function pick(s) { choice = s; document.querySelectorAll('.ans').forEach(b => b.classList.toggle('on', b.dataset.s === s)); document.getElementById('countRow').classList.toggle('show', s === 'in'); const br = document.getElementById('bringRow'); if (br) br.style.display = s === 'out' ? 'none' : ''; }
function step(d) { count = Math.min(20, Math.max(1, count + d)); document.getElementById('countVal').textContent = count; }

async function send() {
  const name = document.getElementById('name').value.trim(), msg = document.getElementById('msg');
  if (!name) { msg.textContent = 'Add your name so the host knows who you are.'; document.getElementById('name').focus(); return; }
  if (!choice) { msg.textContent = 'Pick an answer above.'; return; }
  const btn = document.getElementById('sendBtn'); btn.disabled = true; msg.textContent = 'Sending…';
  try {
    const myVia = (LS.get('wp_via', {}))[id] || via;
    const r = await fetch(API + '/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, rid: rid(), name, status: choice, count, bring: document.getElementById('bring')?.value.trim() || '', via: myVia && myVia !== name ? myVia : '' }) });
    if (!r.ok) throw new Error((await r.json()).error || 'failed');
    LS.set('wp_name', name);
    const a = LS.get('wp_answers', {}); a[id] = { status: choice, count, bring: document.getElementById('bring')?.value.trim() || '' }; LS.set('wp_answers', a);
    await load();
    document.getElementById('msg').textContent = choice === 'in' ? '✅ You\'re on the list. See you there!' : '✅ Got it, thanks for letting them know.';
  } catch (e) { btn.disabled = false; msg.textContent = 'Couldn\'t send. Try again.'; }
}

async function removeAns(r, name) {
  if (!confirm('Remove ' + name + '\'s answer?')) return;
  await fetch(API + '/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, rid: r, remove: true, hostKey }) });
  load();
}

function forward() {
  const me = document.getElementById('name')?.value.trim() || LS.get('wp_name', '');
  const url = location.origin + '/p/' + id + (me ? '?via=' + encodeURIComponent(me) : '');
  const p = data.party;
  const text = `${isTail() ? '🍔' : '📺'} ${partyName()}: ${p.game || 'Spartans game'}\n📍 ${p.place}${p.time ? '\n🕖 Meet at ' + p.time : ''}\n\n👉 Tap the link, add your name and pick 🙌 I'm in, 🤔 Maybe or 😞 Can't. Takes 10 seconds, no app needed:`;
  if (navigator.share) navigator.share({ title: partyName(), text, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text + '\n' + url).then(() => { const m = document.getElementById('msg'); if (m) m.textContent = '📋 Invite copied. Paste it in a text.'; });
  else prompt('Copy this invite:', text + '\n' + url);
}

// Remember who forwarded this link to me, so my answer shows "via ___"
if (via) { const v = LS.get('wp_via', {}); if (!v[id]) { v[id] = via; LS.set('wp_via', v); } }
load();
setInterval(() => { if (document.visibilityState === 'visible' && !document.activeElement?.matches('input')) load(); }, 30000);
</script>
</body>
